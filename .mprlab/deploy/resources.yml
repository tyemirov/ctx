---
mprlab_resources:
  owner: ctx
  release:
    scheme: semver
  ci:
    enabled: true
    command:
      "0": make
      "1": ci
  defaults:
    timeouts:
      startup: 2m
      completion: 30m
      readiness: 5m
      request: 30s
      shutdown: 30s
  operations:
    ci:
      timeouts:
        completion: 30m
    app_lifecycle.repository_read:
      polling: &lifecycle-polling
        initial: 2s
        maximum: 15s
        increment: 2s
        multiplier: 2
        attempt_limit: 60
    app-plan-release: &plan-policy
      timeouts:
        completion: 2m
      polling: *lifecycle-polling
    app-plan-publish: *plan-policy
    app-plan-deploy: *plan-policy
    app-release:
      timeouts:
        completion: 30m
      polling: *lifecycle-polling
    app-publish:
      timeouts:
        completion: 4h
      polling: *lifecycle-polling
    app-deploy:
      timeouts:
        completion: 20m
      polling: *lifecycle-polling
  resources:
    ctx-cli-linux-amd64:
      kind: github_release_binary
      repository: tyemirov/ctx
      build:
        system: go
        package: .
        binary: ctx
        environment:
          CGO_ENABLED: '1'
          CC: zig cc -target x86_64-linux-musl
          CGO_LDFLAGS: -static
        platforms:
        - linux/amd64
    ctx-cli-darwin-amd64:
      kind: github_release_binary
      repository: tyemirov/ctx
      build:
        system: go
        package: .
        binary: ctx
        environment:
          CGO_ENABLED: '1'
          CC: clang -arch x86_64
        platforms:
        - darwin/amd64
    ctx-cli-darwin-arm64:
      kind: github_release_binary
      repository: tyemirov/ctx
      build:
        system: go
        package: .
        binary: ctx
        environment:
          CGO_ENABLED: '1'
          CC: clang -arch arm64
        platforms:
        - darwin/arm64
    ctx-cli-windows-amd64:
      kind: github_release_binary
      repository: tyemirov/ctx
      build:
        system: go
        package: .
        binary: ctx
        environment:
          CGO_ENABLED: '1'
          CC: zig cc -target x86_64-windows-gnu
        platforms:
        - windows/amd64
    ctx-docs:
      kind: github_pages
      repository: tyemirov/ctx
      branch: gh-pages
      domain: ctx.mprlab.com
      url: https://ctx.mprlab.com/
      source:
        kind: directory
        path: docs
      verification:
        path: /.mprlab-release.json
