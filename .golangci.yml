version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - unused
    - copyloopvar
    - cyclop
    - depguard
    - dupl
    - funlen
    - goconst
    - gocritic
    - godot
    - godox
    - goprintffuncname
    - gosec
    - lll
    - nakedret
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - whitespace
  settings:
    depguard:
      rules:
        repository:
          list-mode: strict
          files:
            - "$all"
          allow:
            - "$gostd"
            - "go/"
            - "github.com/tyemirov/ctx/"
            - "github.com/tyemirov/ctx$"
            - "github.com/atotto/clipboard/"
            - "github.com/atotto/clipboard$"
            - "github.com/dlclark/regexp2/"
            - "github.com/dlclark/regexp2$"
            - "github.com/fsnotify/fsnotify/"
            - "github.com/fsnotify/fsnotify$"
            - "github.com/go-viper/mapstructure/v2/"
            - "github.com/go-viper/mapstructure/v2$"
            - "github.com/google/uuid/"
            - "github.com/google/uuid$"
            - "github.com/inconshreveable/mousetrap/"
            - "github.com/inconshreveable/mousetrap$"
            - "github.com/pelletier/go-toml/v2/"
            - "github.com/pelletier/go-toml/v2$"
            - "github.com/pkoukk/tiktoken-go/"
            - "github.com/pkoukk/tiktoken-go$"
            - "github.com/sagikazarmark/locafero/"
            - "github.com/sagikazarmark/locafero$"
            - "github.com/smacker/go-tree-sitter/"
            - "github.com/smacker/go-tree-sitter$"
            - "github.com/spf13/afero/"
            - "github.com/spf13/afero$"
            - "github.com/spf13/cast/"
            - "github.com/spf13/cast$"
            - "github.com/spf13/cobra/"
            - "github.com/spf13/cobra$"
            - "github.com/spf13/pflag/"
            - "github.com/spf13/pflag$"
            - "github.com/spf13/viper/"
            - "github.com/spf13/viper$"
            - "github.com/subosito/gotenv/"
            - "github.com/subosito/gotenv$"
            - "go.uber.org/multierr/"
            - "go.uber.org/multierr$"
            - "go.uber.org/zap/"
            - "go.uber.org/zap$"
            - "go.yaml.in/yaml/v3/"
            - "go.yaml.in/yaml/v3$"
            - "golang.org/x/mod/"
            - "golang.org/x/mod$"
            - "golang.org/x/sync/"
            - "golang.org/x/sync$"
            - "golang.org/x/sys/"
            - "golang.org/x/sys$"
            - "golang.org/x/text/"
            - "golang.org/x/text$"
            - "golang.org/x/tools/"
            - "golang.org/x/tools$"
            - "gopkg.in/check.v1/"
            - "gopkg.in/check.v1$"
            - "gopkg.in/yaml.v3/"
            - "gopkg.in/yaml.v3$"
    staticcheck:
      checks:
        - all
    gocritic:
      enabled-checks:
        - commentedOutCode
        - dupImport
        - rangeExprCopy
        - hugeParam
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
